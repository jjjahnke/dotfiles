---
- name: Setup Development Environment
  hosts: localhost
  become: yes
  vars:
    dotfiles_dir: "{{ ansible_env.PWD }}"

  tasks:
    - name: Ensure Homebrew is installed (macOS)
      shell: |
        /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
      args:
        executable: /bin/bash
      when: ansible_facts['os_family'] == 'Darwin'

    - name: Ensure required packages are installed (macOS)
      homebrew:
        name: "{{ item }}"
        state: present
      loop:
        - curl
        - jq
        - kubectl
      when: ansible_facts['os_family'] == 'Darwin'

    - name: Ensure required packages are installed (Linux)
      package:
        name: "{{ item }}"
        state: present
      loop:
        - curl
        - jq
        - kubectl
      when: ansible_facts['os_family'] != 'Darwin'

    - name: Install SDKMAN
      shell: |
        curl -s "https://get.sdkman.io" | bash
      args:
        executable: /bin/bash

    - name: Install NVM
      shell: |
        export NVM_DIR="$HOME/.nvm"
        mkdir -p "$NVM_DIR"
        curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.1/install.sh | bash
      args:
        executable: /bin/bash

    - name: Clone tmuxifier
      git:
        repo: 'https://github.com/jimeh/tmuxifier.git'
        dest: '{{ ansible_env.HOME }}/.tmuxifier'

    - name: Install tmux-256color terminfo
      shell: |
        tic tmux-256color.terminfo
      args:
        chdir: "{{ dotfiles_dir }}"

    - name: Install Krew
      shell: |
        set -x; cd "$(mktemp -d)" &&
        OS="$(uname | tr '[:upper:]' '[:lower:]')" &&
        ARCH="$(uname -m | sed -e 's/x86_64/amd64/' -e 's/\(arm\)\(64\)\?.*/\1\2/' -e 's/aarch64$/arm64/')" &&
        KREW="krew-${OS}_${ARCH}" &&
        curl -fsSLO "https://github.com/kubernetes-sigs/krew/releases/latest/download/${KREW}.tar.gz" &&
        tar zxvf "${KREW}.tar.gz" &&
        ./"${KREW}" install krew
      args:
        executable: /bin/bash

    - name: Install Krew plugins
      shell: |
        kubectl krew install ctx
        kubectl krew install ns
      args:
        executable: /bin/bash

    - name: Copy config-kube-config.sh to .kube directory
      copy:
        src: "{{ dotfiles_dir }}/config-kube-config.sh"
        dest: "{{ ansible_env.HOME }}/.kube/config-kube-config.sh"

    - name: Install Pyenv dependencies
      package:
        name: "{{ item }}"
        state: present
      loop:
        - make
        - build-essential
        - libssl-dev
        - zlib1g-dev
        - libbz2-dev
        - libreadline-dev
        - libsqlite3-dev
        - wget
        - curl
        - llvm
        - libncurses5-dev
        - libncursesw5-dev
        - xz-utils
        - tk-dev
        - libffi-dev
        - liblzma-dev
        - python-openssl

    - name: Install Pyenv
      git:
        repo: 'https://github.com/pyenv/pyenv.git'
        dest: '{{ ansible_env.HOME }}/.pyenv'

    - name: Install Golang
      package:
        name: golang
        state: present

    - name: Create symbolic links for Bash
      file:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        state: link
        force: yes
      loop:
        - { src: "{{ dotfiles_dir }}/.bashrc", dest: "{{ ansible_env.HOME }}/.bashrc" }
        - { src: "{{ dotfiles_dir }}/.profile", dest: "{{ ansible_env.HOME }}/.profile" }
        - { src: "{{ dotfiles_dir }}/.alias", dest: "{{ ansible_env.HOME }}/.alias" }
        - { src: "{{ dotfiles_dir }}/.console", dest: "{{ ansible_env.HOME }}/.console" }
        - { src: "{{ dotfiles_dir }}/.tmux.conf", dest: "{{ ansible_env.HOME }}/.tmux.conf" }
      when: zsh_check.rc != 0
