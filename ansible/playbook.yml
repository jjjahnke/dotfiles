---
- name: Setup Development Environment
  hosts: localhost
  become: yes
  tasks:
    - name: Ensure curl is installed
      package:
        name: curl
        state: present

    - name: Install NVM
      shell: |
        export NVM_DIR="$HOME/.nvm"
        mkdir -p "$NVM_DIR"
        curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.1/install.sh | bash
      args:
        executable: /bin/bash

    - name: Install Pyenv dependencies
      package:
        name: "{{ item }}"
        state: present
      loop:
        - make
        - build-essential
        - libssl-dev
        - zlib1g-dev
        - libbz2-dev
        - libreadline-dev
        - libsqlite3-dev
        - wget
        - curl
        - llvm
        - libncurses5-dev
        - libncursesw5-dev
        - xz-utils
        - tk-dev
        - libffi-dev
        - liblzma-dev
        - python-openssl
        - git

    - name: Install Pyenv
      git:
        repo: 'https://github.com/pyenv/pyenv.git'
        dest: '{{ ansible_env.HOME }}/.pyenv'

    - name: Install Golang
      package:
        name: golang
        state: present

    - name: Check if Zsh is installed
      command: which zsh
      register: zsh_check
      ignore_errors: yes

    - name: Create symbolic links for Zsh
      file:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        state: link
        force: yes
      loop:
        - { src: "{{ ansible_env.PWD }}/.zshrc", dest: "{{ ansible_env.HOME }}/.zshrc" }
        - { src: "{{ ansible_env.PWD }}/.zprofile", dest: "{{ ansible_env.HOME }}/.zprofile" }
        - { src: "{{ ansible_env.PWD }}/.alias", dest: "{{ ansible_env.HOME }}/.alias" }
        - { src: "{{ ansible_env.PWD }}/.console", dest: "{{ ansible_env.HOME }}/.console" }
        - { src: "{{ ansible_env.PWD }}/.tmux.conf", dest: "{{ ansible_env.HOME }}/.tmux.conf" }
      when: zsh_check.rc == 0

    - name: Create symbolic links for Bash
      file:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        state: link
        force: yes
      loop:
        - { src: "{{ ansible_env.PWD }}/.bashrc", dest: "{{ ansible_env.HOME }}/.bashrc" }
        - { src: "{{ ansible_env.PWD }}/.profile", dest: "{{ ansible_env.HOME }}/.profile" }
        - { src: "{{ ansible_env.PWD }}/.alias", dest: "{{ ansible_env.HOME }}/.alias" }
        - { src: "{{ ansible_env.PWD }}/.console", dest: "{{ ansible_env.HOME }}/.console" }
        - { src: "{{ ansible_env.PWD }}/.tmux.conf", dest: "{{ ansible_env.HOME }}/.tmux.conf" }
      when: zsh_check.rc != 0
